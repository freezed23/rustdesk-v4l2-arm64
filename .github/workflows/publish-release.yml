name: Publish RustDesk 1.4.9 V4L2M2M Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish-release:
    name: Publish existing ARM64 artifact as Release
    runs-on: ubuntu-22.04
    steps:
      - name: Download successful ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-1.4.9-v4l2m2m-aarch64
          path: release
          repository: ${{ github.repository }}
          run-id: 35055417042
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify DEB
        run: |
          set -euxo pipefail
          find release -type f -maxdepth 2 -print
          DEB="$(find release -type f -name '*.deb' -print -quit)"
          test -n "$DEB"
          ls -lh "$DEB"
          dpkg-deb --info "$DEB" | head -40
          sha256sum "$DEB"

      - name: Create GitHub Release and upload DEB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG='v1.4.9-v4l2m2m'
          TARGET='6388a3348615df0193f156fb327e8d6f5edfcb67'
          DEB="$(find release -type f -name '*.deb' -print -quit)"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title 'RustDesk 1.4.9 ARM64 V4L2M2M' \
              --notes 'Custom RustDesk 1.4.9 ARM64 build with Linux V4L2 M2M decoder paths for H.264, HEVC, VP9, and VP8. This build adds runtime handling for asynchronous V4L2M2M decode behavior and enables VP9/VP8 hwcodec data-format paths. H.264/HEVC/VP9 are intended for Amlogic meson_vdec where supported; VP8 falls back to software when the kernel driver does not expose VP8 decode.'
          else
            gh release create "$TAG" "$DEB" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title 'RustDesk 1.4.9 ARM64 V4L2M2M' \
              --notes 'Custom RustDesk 1.4.9 ARM64 build with Linux V4L2 M2M decoder paths for H.264, HEVC, VP9, and VP8. This build adds runtime handling for asynchronous V4L2M2M decode behavior and enables VP9/VP8 hwcodec data-format paths. H.264/HEVC/VP9 are intended for Amlogic meson_vdec where supported; VP8 falls back to software when the kernel driver does not expose VP8 decode.'
          fi

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,name,assets
