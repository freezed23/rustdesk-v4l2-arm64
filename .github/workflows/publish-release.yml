name: Publish RustDesk 1.4.9 V4L2M2M Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish-release:
    name: Publish existing ARM64 artifact as Release
    runs-on: ubuntu-22.04
    steps:
      - name: Download successful ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-1.4.9-v4l2m2m-aarch64
          path: release
          repository: ${{ github.repository }}
          run-id: 35031731141
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify DEB
        run: |
          set -euxo pipefail
          find release -type f -maxdepth 2 -print
          DEB="$(find release -type f -name '*.deb' -print -quit)"
          test -n "$DEB"
          ls -lh "$DEB"
          dpkg-deb --info "$DEB" | head -40
          sha256sum "$DEB"

      - name: Create GitHub Release and upload DEB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG='v1.4.9-v4l2m2m'
          TARGET='69bf7e2cf932ddc913df354371a4cb4c5cdeaee2'
          DEB="$(find release -type f -name '*.deb' -print -quit)"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$DEB" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title 'RustDesk 1.4.9 ARM64 V4L2M2M' \
              --notes 'Custom RustDesk 1.4.9 ARM64 build with Linux H.264 V4L2 M2M decoder support for Amlogic meson_vdec devices. Built from RustDesk commit 6c578292e with the local hwcodec V4L2M2M patch. Intended for testing on ARM64 Armbian devices such as S905X/S912.'
          fi

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,name,assets
