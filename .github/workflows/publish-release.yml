name: Publish RustDesk 1.4.9 V4L2M2M Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish-release:
    name: Publish existing ARM64 artifact as Release
    runs-on: ubuntu-22.04
    steps:
      - name: Download successful ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: rustdesk-1.4.9-v4l2m2m-aarch64
          path: release
          repository: ${{ github.repository }}
          run-id: 35182250478
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify DEB
        run: |
          set -euxo pipefail
          find release -type f -maxdepth 2 -print
          DEB="$(find release -type f -name '*.deb' -print -quit)"
          test -n "$DEB"
          ls -lh "$DEB"
          dpkg-deb --info "$DEB" | head -40
          sha256sum "$DEB"

      - name: Create GitHub Release and upload DEB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TAG='v1.4.9-v4l2m2m'
          TARGET='29c7993480b3931457e3bb4f0b0448de88275951'
          DEB="$(find release -type f -name '*.deb' -print -quit)"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title 'RustDesk 1.4.9 ARM64 V4L2M2M Diagnostics' \
              --notes 'Run #13 diagnostic build. Includes RustDesk/hwcodec V4L2M2M diagnostics plus FFmpeg 7.1.1 V4L2 S_FMT requested/returned sizeimage and QUERYBUF actual buffer length logging.'
          else
            gh release create "$TAG" "$DEB" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET" \
              --title 'RustDesk 1.4.9 ARM64 V4L2M2M Diagnostics' \
              --notes 'Run #13 diagnostic build. Includes RustDesk/hwcodec V4L2M2M diagnostics plus FFmpeg 7.1.1 V4L2 S_FMT requested/returned sizeimage and QUERYBUF actual buffer length logging.'
          fi

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,name,assets
