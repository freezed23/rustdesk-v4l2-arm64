name: Publish RustDesk Android TV MediaCodec ARMv7

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build RustDesk Android TV MediaCodec ARMv7
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve source run
        id: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            latest=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-android-mediacodec-tvbox-armv7.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            test -n "$latest"
            echo "run_id=$latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Android armeabi-v7a artifact
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.src.outputs.run_id }}
          name: rustdesk-1.4.9-android-mediacodec-sidebyside-armeabi-v7a
          path: release
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          test -f release/rustdesk-1.4.9-android-mediacodec-sidebyside-armeabi-v7a.apk
          ls -lh release/rustdesk-1.4.9-android-mediacodec-sidebyside-armeabi-v7a.apk
          sha256sum release/rustdesk-1.4.9-android-mediacodec-sidebyside-armeabi-v7a.apk

      - name: Publish Android armeabi-v7a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euxo pipefail
          TAG='v1.4.9-android-mediacodec-sidebyside-armv7'
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "RustDesk 1.4.9 Android MediaCodec Side-by-Side ARMv7" \
              --notes "Experimental armeabi-v7a Android 9 TV-box MediaCodec + direct Surface build with applicationId com.carriez.flutter_hbb.mediacodec."
          fi
          gh release upload "$TAG" \
            release/rustdesk-1.4.9-android-mediacodec-sidebyside-armeabi-v7a.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,name,assets
